# ============================================================
# HOW TO USE:
# Replace .github/workflows/game.yml in your repo with this
# Then: Actions tab → Run workflow
# The output will be game.gif in your main branch root
# ============================================================

name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # required by gh-space-shooter

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'game.gif'
          strategy: 'random'
