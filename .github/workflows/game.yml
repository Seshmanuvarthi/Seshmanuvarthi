# 1. Create a repo named exactly: Seshmanuvarthi  (same as username)
# 2. Inside that repo create:  .github/workflows/game.yml
# 3. Paste this entire file there
# 4. Go to Settings → Actions → General → enable "Read and write permissions"
# 5. Run the workflow once manually from the Actions tab
